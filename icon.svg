<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#F5E6A0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F5E6A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A5A3E"/>
      <stop offset="100%" stop-color="#1A3028"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0C1B15"/>
  <!-- glow -->
  <circle cx="50" cy="45" r="35" fill="url(#glow)"/>
  <!-- chain -->
  <line x1="50" y1="6" x2="50" y2="20" stroke="#D9B36A" stroke-width="1.5" stroke-dasharray="2 2"/>
  <!-- top ornament -->
  <circle cx="50" cy="20" r="3" fill="#D9B36A"/>
  <path d="M46 20 L50 14 L54 20" fill="#D9B36A"/>
  <!-- lantern body -->
  <path d="M38 28 L36 58 Q50 64 64 58 L62 28 Z" fill="url(#glass)" stroke="#D9B36A" stroke-width="1.5"/>
  <!-- decorative bands -->
  <line x1="38" y1="28" x2="62" y2="28" stroke="#D9B36A" stroke-width="2"/>
  <line x1="37" y1="42" x2="63" y2="42" stroke="#D9B36A" stroke-width="0.8" opacity="0.5"/>
  <line x1="36.5" y1="50" x2="63.5" y2="50" stroke="#D9B36A" stroke-width="0.8" opacity="0.5"/>
  <!-- flame -->
  <path d="M50 34 Q47 40 50 48 Q53 40 50 34Z" fill="#E8C96A" opacity="0.9"/>
  <path d="M50 37 Q48.5 42 50 46 Q51.5 42 50 37Z" fill="#FFF8DC" opacity="0.7"/>
  <!-- bottom finial -->
  <circle cx="50" cy="62" r="2" fill="#D9B36A"/>
  <line x1="50" y1="64" x2="50" y2="72" stroke="#D9B36A" stroke-width="1.5"/>
  <path d="M47 72 L50 78 L53 72" fill="#D9B36A"/>
  <!-- light rays -->
  <line x1="50" y1="42" x2="28" y2="36" stroke="#D9B36A" stroke-width="0.6" opacity="0.3"/>
  <line x1="50" y1="42" x2="72" y2="36" stroke="#D9B36A" stroke-width="0.6" opacity="0.3"/>
  <line x1="50" y1="42" x2="30" y2="52" stroke="#D9B36A" stroke-width="0.6" opacity="0.3"/>
  <line x1="50" y1="42" x2="70" y2="52" stroke="#D9B36A" stroke-width="0.6" opacity="0.3"/>
</svg>
